    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Readex+Pro:wght@200..700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              burgundy: {
                DEFAULT: '#8C1130',
                light: '#A51D3F',
                dark: '#6A0B24',
              },
              cream: {
                50: '#FDFCF0',
                100: '#FAF9F0',
                200: '#F5F4E8',
              },
              forest: {
                900: '#1B3022',
                950: '#0D1A12',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              readex: ['Readex Pro', 'sans-serif'],
              playfair: ['Playfair Display', 'serif'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2s infinite linear',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FDFCF0;
        color: #1C1917;
        transition: background-color 0.3s ease;
        -webkit-font-smoothing: antialiased;
      }

      .dark body {
        background-color: #0D1A12;
        color: #FDFCF0;
      }

      .premium-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(140, 17, 48, 0.1);
        box-shadow: 0 10px 40px -10px rgba(140, 17, 48, 0.05);
      }

      .dark .premium-card {
        background: rgba(27, 48, 34, 0.8);
        border: 1px solid rgba(140, 17, 48, 0.2);
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-turbo {
        animation: fade-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .zen-shadow {
        box-shadow: 0 20px 50px -15px rgba(140, 17, 48, 0.08);
      }

      .logo-glow {
        filter: drop-shadow(0 0 8px rgba(140, 17, 48, 0.3));
      }

      [dir="rtl"] .font-playfair { font-family: 'Readex Pro', sans-serif; }

      .skeleton {
        background: linear-gradient(90deg, #F5F4E8 25%, #FAF9F0 50%, #F5F4E8 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      
      .dark .skeleton {
        background: linear-gradient(90deg, #1B3022 25%, #253F2E 50%, #1B3022 75%);
        background-size: 200% 100%;
      }
    </style>
